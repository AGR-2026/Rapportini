<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d5c4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trasporti">
<link rel="manifest" href="manifest-trasporti.json">
<link rel="apple-touch-icon" href="icona-trasporti.png">
<title>Rapportino Trasporti Uva</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f1f5f2;
    color: #2b2b2b;
    padding: 16px;
    max-width: 520px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.35rem;
    color: #1d5c4b;
    text-align: center;
    margin: 8px 0 14px;
  }
  .campo { margin-bottom: 16px; }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 0.95rem;
  }
  select, input, textarea {
    width: 100%;
    padding: 14px 12px;
    font-size: 1.05rem;
    border: 1px solid #b8c9c0;
    border-radius: 10px;
    background: #fff;
    appearance: none;
    -webkit-appearance: none;
  }
  select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%231d5c4b' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 38px; }
  textarea { min-height: 90px; resize: vertical; }
  .hint { font-size: 0.8rem; color: #6b8279; margin-top: 4px; }
  .nascosto { display: none; }
  button {
    width: 100%;
    padding: 16px;
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    background: #1d5c4b;
    border: none;
    border-radius: 12px;
    margin-top: 6px;
  }
  button:disabled { background: #9db3aa; }
  button.secondario {
    background: none;
    color: #6b8279;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 12px;
    text-decoration: underline;
    margin-top: 2px;
  }
  button.piccolo { font-size: 0.95rem; padding: 10px; margin-top: 8px; }
  #contatore {
    text-align: center;
    font-size: 0.85rem;
    color: #6b8279;
    margin: -4px 0 12px;
  }

  /* ---------- barra di stato (coda) ---------- */
  #stato { border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; font-size: 0.92rem; }
  #stato.attesa { background: #fff4d6; border: 1px solid #d8a800; color: #6b4e00; }
  #stato.inviato { background: #e2f3e5; border: 1px solid #1c6b2d; color: #1c6b2d; }
  #stato.guasto { background: #fde8e8; border: 1px solid #a12626; color: #a12626; }
  #stato b { display: block; margin-bottom: 2px; }
  #stato button { background: #6b4e00; }
  #stato.guasto button { background: #a12626; }
  #avvisoListe { font-size: 0.82rem; color: #6b8279; text-align: center; margin-bottom: 12px; }

  /* ---------- pannello di conferma / attesa / errore ---------- */
  .pannello { border-radius: 14px; padding: 18px 14px; }
  .pannello.ok { background: #e2f3e5; border: 2px solid #1c6b2d; }
  .pannello.attesa { background: #fff4d6; border: 2px solid #d8a800; }
  .pannello.ko { background: #fde8e8; border: 2px solid #a12626; }
  .p-titolo { text-align: center; font-size: 1.25rem; font-weight: 800; }
  .pannello.ok .p-titolo { color: #1c6b2d; }
  .pannello.attesa .p-titolo { color: #6b4e00; }
  .pannello.ko .p-titolo { color: #a12626; }
  .p-numero {
    text-align: center;
    font-size: 1.55rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin: 12px 0 2px;
    color: #14421f;
  }
  .p-ora { text-align: center; font-size: 0.95rem; color: #3c5a43; margin-bottom: 14px; }
  .pannello.attesa .p-ora { color: #6b4e00; }
  .p-testo { text-align: center; font-size: 1rem; margin: 10px 0 12px; }
  .riepilogo {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
  }
  .riepilogo td { padding: 9px 10px; border-bottom: 1px solid #ececec; font-size: 0.95rem; vertical-align: top; }
  .riepilogo tr:last-child td { border-bottom: none; }
  .riepilogo td.k { color: #5c5c5c; width: 42%; }
  .riepilogo td.v { font-weight: 700; word-break: break-word; }
  .p-nota { text-align: center; font-size: 0.85rem; color: #4a5c4e; margin-top: 12px; }
  .pannello.attesa .p-nota { color: #6b4e00; }
  .p-lista { margin-top: 14px; font-size: 0.85rem; color: #3c5a43; }
  .p-lista b { display: block; margin-bottom: 4px; }
  .p-lista div.v { padding: 2px 0; }
  .pannello.ok button { background: #1c6b2d; }
  .pannello.attesa button { background: #8a6500; }
  .pannello.ko button { background: #a12626; }
  .pannello.ok button.secondario { background: none; color: #3c5a43; }
  .pannello.attesa button.secondario { background: none; color: #6b4e00; }
  .pannello.ko button.secondario { background: none; color: #a12626; }

  #caricamento { text-align: center; color: #6b8279; padding: 30px 0; }
</style>
</head>
<body>

<h1>🚜 Rapportino Trasporti Uva</h1>

<div id="stato" class="nascosto"></div>
<div id="caricamento">Caricamento liste…</div>
<div id="avvisoListe" class="nascosto"></div>
<div id="contatore"></div>

<form id="modulo" class="nascosto" autocomplete="off">

  <div class="campo">
    <label for="data">Data</label>
    <input type="date" id="data" required>
  </div>

  <div class="campo">
    <label for="cliente">Cliente</label>
    <select id="cliente" required></select>
  </div>

  <div class="campo">
    <label for="varieta">Varietà d'uva</label>
    <select id="varieta" required></select>
  </div>

  <div class="campo">
    <label for="operatore">Operatore</label>
    <select id="operatore" required></select>
  </div>

  <div class="campo">
    <label for="trattore">Trattore</label>
    <select id="trattore" required></select>
  </div>

  <div class="campo">
    <label for="rimorchio">Rimorchio</label>
    <select id="rimorchio" required></select>
  </div>

  <div class="campo">
    <label for="destinazione">Destinazione</label>
    <select id="destinazione" required></select>
  </div>

  <div class="campo">
    <label for="quintali">Quintali</label>
    <input type="number" id="quintali" inputmode="decimal" step="0.1" min="0" required>
    <div class="hint">Dopo l'invio restano impostati cliente, varietà, operatore, trattore, rimorchio e destinazione: per il viaggio dopo basta rimettere i quintali.</div>
  </div>

  <div class="campo">
    <label for="note">Note (anche dettate)</label>
    <textarea id="note" placeholder="Note libere…"></textarea>
  </div>

  <button type="submit" id="invia">Invia trasporto</button>
  <button type="button" id="azzera" class="secondario">Svuota tutto e ricomincia</button>
</form>

<!-- Pannello che compare AL POSTO del modulo dopo l'invio -->
<div id="pannello" class="pannello nascosto"></div>

<script>
// ============================================================
// URL del deployment Apps Script (finisce con /exec)
// Da aggiornare SOLO se si crea un NUOVO deployment.
var API_URL = 'https://script.google.com/macros/s/AKfycbwFxoChLKvcKhhRhFDZiE9Zk9iNIcGADG-ZdHMBGh5vWdsBxIwQ23Ypf_ZLRTky-y-JKQ/exec';
// ============================================================

var ALTRO = 'Altro (spiego nelle note)';
var K_CODA = 'trasporti_coda';        // viaggi compilati e non ancora arrivati a Google
var K_LISTE = 'trasporti_liste';      // ultime tendine scaricate (per aprire senza rete)
var K_STORICO = 'trasporti_storico';  // ultimi viaggi confermati, con il loro numero

function el(id) { return document.getElementById(id); }

// ---------- memoria del telefono ----------
// Se il browser non la concede (navigazione privata), si continua a lavorare in
// memoria volatile: la pagina avvisa che la coda dura solo finché resta aperta.
var HA_MEMORIA = (function () {
  try {
    localStorage.setItem('__prova__', '1');
    localStorage.removeItem('__prova__');
    return true;
  } catch (e) { return false; }
})();
var memoriaVolatile = {};

function leggi(chiave, seVuoto) {
  try {
    if (HA_MEMORIA) {
      var v = localStorage.getItem(chiave);
      return v ? JSON.parse(v) : seVuoto;
    }
  } catch (e) { /* cado sotto */ }
  return (chiave in memoriaVolatile) ? memoriaVolatile[chiave] : seVuoto;
}

function scrivi(chiave, valore) {
  memoriaVolatile[chiave] = valore;
  if (!HA_MEMORIA) return;
  try { localStorage.setItem(chiave, JSON.stringify(valore)); } catch (e) { /* pieno: resta in memoria */ }
}

// ---------- utilità ----------
// Data di OGGI secondo l'orologio del telefono.
// (toISOString darebbe l'ora di Londra: dopo mezzanotte scriverebbe ieri)
function oggi() {
  var d = new Date();
  var m = String(d.getMonth() + 1);
  var g = String(d.getDate());
  if (m.length < 2) m = '0' + m;
  if (g.length < 2) g = '0' + g;
  return d.getFullYear() + '-' + m + '-' + g;
}

function oraLocale(d) {
  d = d || new Date();
  function due(n) { return (n < 10 ? '0' : '') + n; }
  return due(d.getDate()) + '/' + due(d.getMonth() + 1) + '/' + d.getFullYear() +
    ' ' + due(d.getHours()) + ':' + due(d.getMinutes());
}

// Codice unico dell'invio: il server lo usa per non registrare due volte lo
// stesso viaggio, anche se parte due volte.
function nuovoIdInvio() {
  return 't' + Date.now() + '-' + Math.floor(Math.random() * 1e6);
}

function dataItaliana(iso) {
  if (!iso) return '';
  var p = String(iso).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
}

function riempi(select, lista) {
  select.innerHTML = '';
  var ph = document.createElement('option');
  ph.value = '';
  ph.textContent = '— scegli —';
  ph.disabled = true;
  ph.selected = true;
  select.appendChild(ph);
  (lista || []).forEach(function (v) {
    var o = document.createElement('option');
    o.value = v;
    o.textContent = v;
    select.appendChild(o);
  });
  var altro = document.createElement('option');
  altro.value = ALTRO;
  altro.textContent = ALTRO;
  select.appendChild(altro);
}

// ---------- caricamento tendine (con copia di scorta sul telefono) ----------
function mostraTendine(d) {
  riempi(el('cliente'), d.clienti);
  riempi(el('varieta'), d.varieta);
  riempi(el('operatore'), d.operatori);
  riempi(el('trattore'), d.trattori);
  riempi(el('rimorchio'), d.rimorchi);
  riempi(el('destinazione'), d.destinazioni);

  el('data').value = oggi();
  el('caricamento').classList.add('nascosto');
  el('modulo').classList.remove('nascosto');
}

function caricaTendine() {
  fetch(API_URL + '?action=data')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.clienti) throw new Error('risposta strana');
      scrivi(K_LISTE, { dati: d, quando: oraLocale() });
      mostraTendine(d);
      el('avvisoListe').classList.add('nascosto');
    })
    .catch(function () {
      var salvate = leggi(K_LISTE, null);
      if (salvate && salvate.dati) {
        mostraTendine(salvate.dati);
        el('avvisoListe').textContent =
          'Senza rete: elenchi dell’ultimo collegamento (' + salvate.quando + ').';
        el('avvisoListe').classList.remove('nascosto');
      } else {
        el('caricamento').textContent =
          'Prima volta senza rete: gli elenchi non sono ancora stati scaricati. ' +
          'Apri la pagina una volta dove c’è campo.';
      }
    });
}

// ---------- coda: il viaggio sta sul telefono finché Google non lo conferma ----------
function leggiCoda() { return leggi(K_CODA, []); }
function scriviCoda(c) { scrivi(K_CODA, c); }
function leggiStorico() { return leggi(K_STORICO, []); }

function inCoda(idInvio) {
  var c = leggiCoda();
  for (var i = 0; i < c.length; i++) if (c[i].dati.idInvio === idInvio) return c[i];
  return null;
}

function inStorico(idInvio) {
  var s = leggiStorico();
  for (var i = 0; i < s.length; i++) if (s[i].idInvio === idInvio) return s[i];
  return null;
}

function accodaTrasporto(dati) {
  var c = leggiCoda();
  c.push({ dati: dati, creatoIl: oraLocale() });
  scriviCoda(c);
  aggiornaBarra();
}

function togliDallaCoda(idInvio) {
  scriviCoda(leggiCoda().filter(function (x) { return x.dati.idInvio !== idInvio; }));
}

function segnaConfermato(idInvio, risposta, dati) {
  var s = leggiStorico();
  s.unshift({
    idInvio: idInvio,
    numero: risposta.numero || '',
    orario: risposta.orario || oraLocale(),
    quintali: dati.quintali,
    destinazione: dati.destinazione
  });
  scrivi(K_STORICO, s.slice(0, 30));
}

var invioInCorso = false;
var appenaPartiti = [];   // numeri confermati da poco, mostrati nella barra
var confermatiOggi = [];  // viaggi confermati da quando si è aperta la pagina

// Prova a mandare tutto quello che è in coda, in ordine. Si ferma al primo
// intoppo: il resto riparte al prossimo tentativo.
function svuotaCoda() {
  if (invioInCorso) return Promise.resolve();
  var coda = leggiCoda();
  if (!coda.length) { aggiornaBarra(); return Promise.resolve(); }

  invioInCorso = true;
  aggiornaBarra();

  var catena = Promise.resolve(true);
  coda.forEach(function (item) {
    catena = catena.then(function (continua) {
      if (!continua) return false;
      return inviaItem(item).then(function () { return true; }, function () { return false; });
    });
  });

  return catena.then(function () {
    invioInCorso = false;
    aggiornaBarra();
  });
}

function inviaItem(item) {
  // POST senza header particolari: niente preflight, funziona con Apps Script
  return fetch(API_URL, { method: 'POST', body: JSON.stringify(item.dati) })
    .then(function (r) { return r.json(); })
    .then(function (r) {
      if (!r || !r.ok) {
        // Il server ha risposto ma rifiuta: non è la rete, è un problema vero.
        // Tengo il viaggio in coda (nessun dato perso) e lo segnalo.
        var c = leggiCoda();
        for (var i = 0; i < c.length; i++) {
          if (c[i].dati.idInvio === item.dati.idInvio) c[i].errore = (r && r.errore) || 'rifiutato dal sistema';
        }
        scriviCoda(c);
        throw new Error('rifiutato');
      }
      togliDallaCoda(item.dati.idInvio);
      segnaConfermato(item.dati.idInvio, r, item.dati);
      if (r.numero) appenaPartiti.push(r.numero);
      if (!confermatiOggi.some(function (v) { return v.idInvio === item.dati.idInvio; })) {
        confermatiOggi.push({
          idInvio: item.dati.idInvio,
          numero: r.numero,
          quintali: item.dati.quintali,
          destinazione: item.dati.destinazione
        });
      }
      aggiornaContatore();
      aggiornaBarra();
    });
}

function aggiornaContatore() {
  var n = confermatiOggi.length;
  el('contatore').textContent = n === 0 ? '' :
    (n === 1 ? '1 viaggio registrato da quando hai aperto la pagina'
             : n + ' viaggi registrati da quando hai aperto la pagina');
}

// ---------- barra di stato in cima ----------
function aggiornaBarra() {
  var box = el('stato');
  var coda = leggiCoda();
  var conErrore = coda.filter(function (x) { return x.errore; });
  while (box.firstChild) box.removeChild(box.firstChild);

  if (!coda.length && !appenaPartiti.length) {
    box.className = 'nascosto';
    return;
  }

  if (!coda.length) {
    box.className = 'inviato';
    var ok = document.createElement('b');
    ok.textContent = appenaPartiti.length === 1
      ? '✔ Inviato adesso: ' + appenaPartiti[0]
      : '✔ Inviati adesso: ' + appenaPartiti.join(', ');
    box.appendChild(ok);
    var q = document.createElement('span');
    q.textContent = 'Non c’è più niente in attesa sul telefono.';
    box.appendChild(q);
    return;
  }

  box.className = conErrore.length ? 'guasto' : 'attesa';
  var t = document.createElement('b');
  if (conErrore.length) {
    t.textContent = '⚠ Un viaggio non viene accettato dal sistema';
  } else {
    t.textContent = coda.length === 1
      ? '⏳ 1 viaggio salvato sul telefono, in attesa di rete'
      : '⏳ ' + coda.length + ' viaggi salvati sul telefono, in attesa di rete';
  }
  box.appendChild(t);

  var d = document.createElement('span');
  if (conErrore.length) {
    d.textContent = conErrore[0].errore + ' — avvisa Federico, i dati restano salvati qui.';
  } else if (invioInCorso) {
    d.textContent = 'Invio in corso…';
  } else if (!HA_MEMORIA) {
    d.textContent = 'Attenzione: questo browser non salva i dati. Non chiudere la pagina finché non è partito.';
  } else {
    d.textContent = 'Partono da soli appena torna il campo. Puoi chiudere l’app.';
  }
  box.appendChild(d);

  if (!invioInCorso) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'piccolo';
    b.textContent = 'Prova a inviarli ora';
    b.addEventListener('click', function () { svuotaCoda(); });
    box.appendChild(b);
  }
}

// ---------- pannelli ----------
function svuota(nodo) { while (nodo.firstChild) nodo.removeChild(nodo.firstChild); }

function riga(tab, chiave, valore) {
  if (valore === '' || valore == null) return;
  var tr = document.createElement('tr');
  var td1 = document.createElement('td');
  td1.className = 'k';
  td1.textContent = chiave;
  var td2 = document.createElement('td');
  td2.className = 'v';
  td2.textContent = valore;   // textContent: niente sorprese se le note contengono simboli
  tr.appendChild(td1);
  tr.appendChild(td2);
  tab.appendChild(tr);
}

function tabellaRiepilogo(d) {
  var tab = document.createElement('table');
  tab.className = 'riepilogo';
  riga(tab, 'Data', dataItaliana(d.data));
  riga(tab, 'Cliente', d.cliente);
  riga(tab, 'Varietà', d.varieta);
  riga(tab, 'Operatore', d.operatore);
  riga(tab, 'Trattore', d.trattore);
  riga(tab, 'Rimorchio', d.rimorchio);
  riga(tab, 'Destinazione', d.destinazione);
  riga(tab, 'Quintali', d.quintali);
  riga(tab, 'Note', d.note);
  return tab;
}

function mostraPannello() {
  el('modulo').classList.add('nascosto');
  el('pannello').classList.remove('nascosto');
  window.scrollTo(0, 0);
}

function tornaAlModulo() {
  el('pannello').className = 'pannello nascosto';
  el('modulo').classList.remove('nascosto');
  window.scrollTo(0, 0);
}

function bottoniNuovoViaggio(p) {
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Nuovo viaggio';
  btn.addEventListener('click', function () {
    // tengo data, cliente, varietà, operatore, trattore, rimorchio e destinazione
    el('quintali').value = '';
    el('note').value = '';
    tornaAlModulo();
    el('quintali').focus();
  });
  p.appendChild(btn);

  var btn2 = document.createElement('button');
  btn2.type = 'button';
  btn2.className = 'secondario';
  btn2.textContent = 'Nuovo viaggio cambiando cliente o destinazione';
  btn2.addEventListener('click', function () {
    ['cliente', 'varieta', 'operatore', 'trattore', 'rimorchio', 'destinazione']
      .forEach(function (id) { el(id).selectedIndex = 0; });
    el('quintali').value = '';
    el('note').value = '';
    tornaAlModulo();
  });
  p.appendChild(btn2);
}

function elencoViaggi(p) {
  if (confermatiOggi.length < 2) return;
  var box = document.createElement('div');
  box.className = 'p-lista';
  var tit = document.createElement('b');
  tit.textContent = 'Viaggi registrati da quando hai aperto la pagina:';
  box.appendChild(tit);
  confermatiOggi.forEach(function (v) {
    var r = document.createElement('div');
    r.className = 'v';
    r.textContent = '• ' + (v.numero || '—') + ' — ' + v.quintali + ' q.li a ' + v.destinazione;
    box.appendChild(r);
  });
  p.appendChild(box);
}

function mostraConferma(registrazione, d) {
  var p = el('pannello');
  svuota(p);
  p.className = 'pannello ok';

  var t = document.createElement('div');
  t.className = 'p-titolo';
  t.textContent = '✔ Trasporto registrato';
  p.appendChild(t);

  if (registrazione.numero) {
    var n = document.createElement('div');
    n.className = 'p-numero';
    n.textContent = registrazione.numero;
    p.appendChild(n);
  }

  var o = document.createElement('div');
  o.className = 'p-ora';
  o.textContent = registrazione.orario ? 'Salvato il ' + registrazione.orario : 'Salvato correttamente';
  p.appendChild(o);

  p.appendChild(tabellaRiepilogo(d));
  elencoViaggi(p);

  var nota = document.createElement('div');
  nota.className = 'p-nota';
  nota.textContent = 'Se vuoi tenerne traccia, fai uno screenshot di questa schermata.';
  p.appendChild(nota);

  bottoniNuovoViaggio(p);
  mostraPannello();
}

function mostraInAttesa(d) {
  var p = el('pannello');
  svuota(p);
  p.className = 'pannello attesa';

  var t = document.createElement('div');
  t.className = 'p-titolo';
  t.textContent = '✔ Salvato sul telefono';
  p.appendChild(t);

  var o = document.createElement('div');
  o.className = 'p-ora';
  o.textContent = 'Compilato il ' + oraLocale();
  p.appendChild(o);

  var m = document.createElement('div');
  m.className = 'p-testo';
  m.textContent = 'Manca la rete: partirà da solo appena torna il campo.';
  p.appendChild(m);

  p.appendChild(tabellaRiepilogo(d));

  var nota = document.createElement('div');
  nota.className = 'p-nota';
  nota.textContent = HA_MEMORIA
    ? 'Puoi chiudere l’app: il viaggio resta salvato qui. Il numero arriverà quando sarà partito.'
    : 'Attenzione: questo browser non salva i dati. Tieni la pagina aperta finché non torna il campo.';
  p.appendChild(nota);

  bottoniNuovoViaggio(p);
  mostraPannello();
}

function mostraErroreServer(messaggio, d) {
  var p = el('pannello');
  svuota(p);
  p.className = 'pannello ko';

  var t = document.createElement('div');
  t.className = 'p-titolo';
  t.textContent = '⚠ Il sistema non lo accetta';
  p.appendChild(t);

  var m = document.createElement('div');
  m.className = 'p-testo';
  m.textContent = messaggio;
  p.appendChild(m);

  p.appendChild(tabellaRiepilogo(d));

  var nota = document.createElement('div');
  nota.className = 'p-nota';
  nota.textContent = 'Il viaggio resta salvato sul telefono e verrà ritentato. ' +
    'Se continua, avvisa Federico: probabilmente c’è qualcosa da sistemare nel foglio.';
  p.appendChild(nota);

  bottoniNuovoViaggio(p);
  mostraPannello();
}

function mostraAttesaInvio() {
  var p = el('pannello');
  svuota(p);
  p.className = 'pannello ok';
  var t = document.createElement('div');
  t.className = 'p-titolo';
  t.textContent = 'Invio in corso…';
  p.appendChild(t);
  mostraPannello();
}

// ---------- invio ----------
el('modulo').addEventListener('submit', function (ev) {
  ev.preventDefault();

  var dati = {
    idInvio: nuovoIdInvio(),
    data: el('data').value,
    cliente: el('cliente').value,
    varieta: el('varieta').value,
    operatore: el('operatore').value,
    trattore: el('trattore').value,
    rimorchio: el('rimorchio').value,
    destinazione: el('destinazione').value,
    quintali: el('quintali').value,
    note: el('note').value.trim()
  };

  // PRIMA si salva sul telefono, POI si prova a mandarlo: così non esiste un
  // istante in cui il viaggio sta solo dentro la pagina aperta.
  accodaTrasporto(dati);
  mostraAttesaInvio();

  svuotaCoda().then(function () {
    var reg = inStorico(dati.idInvio);
    if (reg) return mostraConferma(reg, dati);
    var ancora = inCoda(dati.idInvio);
    if (ancora && ancora.errore) return mostraErroreServer(ancora.errore, dati);
    mostraInAttesa(dati);
  });
});

// ---------- svuota tutto (cambio cliente / nuova giornata) ----------
el('azzera').addEventListener('click', function () {
  ['cliente', 'varieta', 'operatore', 'trattore', 'rimorchio', 'destinazione']
    .forEach(function (id) { el(id).selectedIndex = 0; });
  el('quintali').value = '';
  el('note').value = '';
  el('data').value = oggi();
  confermatiOggi = [];
  aggiornaContatore();
  window.scrollTo(0, 0);
});

// ---------- avvii automatici ----------
window.addEventListener('online', function () { appenaPartiti = []; svuotaCoda(); });
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) svuotaCoda();
});
setInterval(function () {
  if (leggiCoda().length && navigator.onLine !== false) svuotaCoda();
}, 45000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () { /* pagina normale */ });
}

aggiornaBarra();
caricaTendine();
svuotaCoda();
</script>
