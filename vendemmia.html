<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Rapportino Vendemmia</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f6f2f4;
    color: #2b2b2b;
    padding: 16px;
    max-width: 520px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.35rem;
    color: #6d1a36;
    text-align: center;
    margin: 8px 0 18px;
  }
  .campo { margin-bottom: 16px; }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 0.95rem;
  }
  select, input, textarea {
    width: 100%;
    padding: 14px 12px;
    font-size: 1.05rem;
    border: 1px solid #c9b8bf;
    border-radius: 10px;
    background: #fff;
    appearance: none;
    -webkit-appearance: none;
  }
  select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236d1a36' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 38px; }
  textarea { min-height: 90px; resize: vertical; }
  .nascosto { display: none; }
  button {
    width: 100%;
    padding: 16px;
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    background: #6d1a36;
    border: none;
    border-radius: 12px;
    margin-top: 6px;
  }
  button:disabled { background: #b39aa5; }
  button.secondario {
    background: none;
    color: #6d1a36;
    font-size: 0.95rem;
    text-decoration: underline;
    padding: 12px;
  }

  /* ---------- pannello di conferma / errore ---------- */
  .pannello { border-radius: 14px; padding: 18px 14px; }
  .pannello.ok { background: #e2f3e5; border: 2px solid #1c6b2d; }
  .pannello.ko { background: #fde8e8; border: 2px solid #a12626; }
  .p-titolo { text-align: center; font-size: 1.25rem; font-weight: 800; }
  .pannello.ok .p-titolo { color: #1c6b2d; }
  .pannello.ko .p-titolo { color: #a12626; }
  .p-numero {
    text-align: center;
    font-size: 1.55rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin: 12px 0 2px;
    color: #14421f;
  }
  .p-ora { text-align: center; font-size: 0.95rem; color: #3c5a43; margin-bottom: 14px; }
  .p-testo { text-align: center; font-size: 1rem; margin: 10px 0 4px; }
  .riepilogo {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
  }
  .riepilogo td { padding: 9px 10px; border-bottom: 1px solid #ececec; font-size: 0.95rem; vertical-align: top; }
  .riepilogo tr:last-child td { border-bottom: none; }
  .riepilogo td.k { color: #5c5c5c; width: 42%; }
  .riepilogo td.v { font-weight: 700; word-break: break-word; }
  .p-nota { text-align: center; font-size: 0.85rem; color: #4a5c4e; margin-top: 12px; }
  .pannello.ok button { background: #1c6b2d; }
  .pannello.ko button { background: #a12626; }
  .pannello.ko button.secondario { background: none; color: #a12626; }

  #caricamento { text-align: center; color: #8a6b77; padding: 30px 0; }
</style>
</head>
<body>

<h1>🍇 Rapportino Vendemmia</h1>

<div id="caricamento">Caricamento liste…</div>

<form id="modulo" class="nascosto" autocomplete="off">

  <div class="campo">
    <label for="data">Data</label>
    <input type="date" id="data" required>
  </div>

  <div class="campo">
    <label for="operatore">Operatore</label>
    <select id="operatore" required></select>
  </div>

  <div class="campo">
    <label for="cliente">Cliente</label>
    <select id="cliente" required></select>
  </div>

  <div class="campo">
    <label for="varieta">Varietà d'uva</label>
    <select id="varieta" required></select>
  </div>

  <div class="campo">
    <label for="mezzo">Mezzo (trattore / vendemmiatrice)</label>
    <select id="mezzo" required></select>
  </div>

  <div class="campo">
    <label for="ettari">Ettari vendemmiati</label>
    <input type="number" id="ettari" inputmode="decimal" step="0.01" min="0" required>
  </div>

  <div class="campo">
    <label for="combinata">In combinata con</label>
    <select id="combinata"></select>
  </div>

  <div class="campo">
    <label for="note">Note (anche dettate)</label>
    <textarea id="note" placeholder="Note libere…"></textarea>
  </div>

  <button type="submit" id="invia">Invia rapportino</button>
</form>

<!-- Pannello che compare AL POSTO del modulo dopo l'invio -->
<div id="pannello" class="pannello nascosto"></div>

<script>
// ============================================================
// URL del deployment Apps Script (finisce con /exec)
// Da aggiornare SOLO se si crea un NUOVO deployment.
var API_URL = 'https://script.google.com/macros/s/AKfycbzjK9mzECXQOIM6yWiD75Wx1Gx-vo5s7RNjZ-od0m2c4Kr7G7a8B7lSLOCzra_TDQdP0A/exec';
// ============================================================

var ALTRO = 'Altro (spiego nelle note)';
var ultimoInvio = null;   // { dati: {...} } dell'ultimo tentativo, per il pulsante "Riprova"

function el(id) { return document.getElementById(id); }

// Data di OGGI secondo l'orologio del telefono.
// (toISOString darebbe l'ora di Londra: dopo mezzanotte scriverebbe ieri)
function oggi() {
  var d = new Date();
  var m = String(d.getMonth() + 1);
  var g = String(d.getDate());
  if (m.length < 2) m = '0' + m;
  if (g.length < 2) g = '0' + g;
  return d.getFullYear() + '-' + m + '-' + g;
}

// Codice unico di questo invio: se l'operatore preme "Riprova" dopo un errore
// di rete, il server lo riconosce e NON scrive il rapportino due volte.
function nuovoIdInvio() {
  return 'v' + Date.now() + '-' + Math.floor(Math.random() * 1e6);
}

function dataItaliana(iso) {
  if (!iso) return '';
  var p = String(iso).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
}

function riempi(select, lista) {
  select.innerHTML = '';
  var ph = document.createElement('option');
  ph.value = '';
  ph.textContent = '— scegli —';
  ph.disabled = true;
  ph.selected = true;
  select.appendChild(ph);
  (lista || []).forEach(function (v) {
    var o = document.createElement('option');
    o.value = v;
    o.textContent = v;
    select.appendChild(o);
  });
  var altro = document.createElement('option');
  altro.value = ALTRO;
  altro.textContent = ALTRO;
  select.appendChild(altro);
}

// ---------- caricamento liste ----------
fetch(API_URL + '?action=data')
  .then(function (r) { return r.json(); })
  .then(function (d) {
    riempi(el('operatore'), d.operatori);
    riempi(el('cliente'), d.clienti);
    riempi(el('varieta'), d.varieta);
    riempi(el('mezzo'), d.mezzi);

    // Combinata: default "No (da solo)", nessun placeholder
    var selC = el('combinata');
    selC.innerHTML = '';
    var no = document.createElement('option');
    no.value = 'No (da solo)';
    no.textContent = 'No (da solo)';
    no.selected = true;
    selC.appendChild(no);
    (d.combinate || []).forEach(function (v) {
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v;
      selC.appendChild(o);
    });
    var altro = document.createElement('option');
    altro.value = ALTRO;
    altro.textContent = ALTRO;
    selC.appendChild(altro);

    el('data').value = oggi();
    el('caricamento').classList.add('nascosto');
    el('modulo').classList.remove('nascosto');
  })
  .catch(function () {
    el('caricamento').textContent =
      'Errore nel caricamento. Controlla la connessione e riapri la pagina.';
  });

// ---------- costruzione dei pannelli ----------
function svuota(nodo) { while (nodo.firstChild) nodo.removeChild(nodo.firstChild); }

function riga(tab, chiave, valore) {
  if (valore === '' || valore == null) return;
  var tr = document.createElement('tr');
  var td1 = document.createElement('td');
  td1.className = 'k';
  td1.textContent = chiave;
  var td2 = document.createElement('td');
  td2.className = 'v';
  td2.textContent = valore;   // textContent: niente sorprese se le note contengono simboli
  tr.appendChild(td1);
  tr.appendChild(td2);
  tab.appendChild(tr);
}

function mostraPannello() {
  el('modulo').classList.add('nascosto');
  el('pannello').classList.remove('nascosto');
  window.scrollTo(0, 0);
}

function tornaAlModulo() {
  el('pannello').classList.add('nascosto');
  el('pannello').className = 'pannello nascosto';
  el('modulo').classList.remove('nascosto');
  window.scrollTo(0, 0);
}

function mostraConferma(risposta, d) {
  var p = el('pannello');
  svuota(p);
  p.className = 'pannello ok';

  var t = document.createElement('div');
  t.className = 'p-titolo';
  t.textContent = risposta.giaRegistrato
    ? '✔ Era già registrato'
    : '✔ Rapportino registrato';
  p.appendChild(t);

  if (risposta.numero) {
    var n = document.createElement('div');
    n.className = 'p-numero';
    n.textContent = risposta.numero;
    p.appendChild(n);
  }

  var o = document.createElement('div');
  o.className = 'p-ora';
  o.textContent = risposta.orario
    ? 'Salvato il ' + risposta.orario
    : 'Salvato correttamente';
  p.appendChild(o);

  var tab = document.createElement('table');
  tab.className = 'riepilogo';
  riga(tab, 'Data', dataItaliana(d.data));
  riga(tab, 'Operatore', d.operatore);
  riga(tab, 'Cliente', d.cliente);
  riga(tab, 'Varietà', d.varieta);
  riga(tab, 'Mezzo', d.mezzo);
  riga(tab, 'Ettari', d.ettari);
  riga(tab, 'In combinata con', d.combinata);
  riga(tab, 'Note', d.note);
  p.appendChild(tab);

  var nota = document.createElement('div');
  nota.className = 'p-nota';
  nota.textContent = 'Se vuoi tenerne traccia, fai uno screenshot di questa schermata.';
  p.appendChild(nota);

  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Nuovo rapportino';
  btn.addEventListener('click', function () {
    // pronto per il prossimo: tengo data e operatore
    el('cliente').selectedIndex = 0;
    el('varieta').selectedIndex = 0;
    el('mezzo').selectedIndex = 0;
    el('ettari').value = '';
    el('combinata').selectedIndex = 0;
    el('note').value = '';
    tornaAlModulo();
  });
  p.appendChild(btn);

  mostraPannello();
}

function mostraErrore(messaggio, d) {
  var p = el('pannello');
  svuota(p);
  p.className = 'pannello ko';

  var t = document.createElement('div');
  t.className = 'p-titolo';
  t.textContent = '✕ NON registrato';
  p.appendChild(t);

  var m = document.createElement('div');
  m.className = 'p-testo';
  m.textContent = messaggio;
  p.appendChild(m);

  var nota = document.createElement('div');
  nota.className = 'p-nota';
  nota.textContent = 'I dati che hai compilato non sono andati persi. ' +
    'Premi "Riprova invio": se per caso era già arrivato, non verrà registrato due volte.';
  p.appendChild(nota);

  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Riprova invio';
  btn.addEventListener('click', function () { invia(d); });
  p.appendChild(btn);

  var btn2 = document.createElement('button');
  btn2.type = 'button';
  btn2.className = 'secondario';
  btn2.textContent = 'Torna al modulo e correggi';
  btn2.addEventListener('click', tornaAlModulo);
  p.appendChild(btn2);

  mostraPannello();
}

function mostraAttesa() {
  var p = el('pannello');
  svuota(p);
  p.className = 'pannello ok';
  var t = document.createElement('div');
  t.className = 'p-titolo';
  t.textContent = 'Invio in corso…';
  p.appendChild(t);
  var m = document.createElement('div');
  m.className = 'p-testo';
  m.textContent = 'Aspetta la conferma prima di chiudere la pagina.';
  p.appendChild(m);
  mostraPannello();
}

// ---------- invio ----------
function invia(d) {
  mostraAttesa();

  // POST senza header particolari: niente preflight, funziona con Apps Script
  fetch(API_URL, { method: 'POST', body: JSON.stringify(d) })
    .then(function (r) { return r.json(); })
    .then(function (r) {
      if (!r || !r.ok) throw new Error((r && r.errore) || 'errore');
      mostraConferma(r, d);
    })
    .catch(function () {
      mostraErrore('Il rapportino non risulta salvato: ' +
        'la connessione è mancata o il server non ha risposto.', d);
    });
}

el('modulo').addEventListener('submit', function (ev) {
  ev.preventDefault();
  ultimoInvio = {
    idInvio: nuovoIdInvio(),
    data: el('data').value,
    operatore: el('operatore').value,
    cliente: el('cliente').value,
    varieta: el('varieta').value,
    mezzo: el('mezzo').value,
    ettari: el('ettari').value,
    combinata: el('combinata').value,
    note: el('note').value.trim()
  };
  invia(ultimoInvio);
});
</script>
</body>
</html>
