<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rapportino lavorazione</title>
<style>
  :root{ --blu:#1b6b3a; --blu-scuro:#14522c; --bordo:#d0d5dd; --bg:#f4f6f4; --txt:#1a1a1a; --grigio:#667085; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
        background:var(--bg); color:var(--txt); font-size:17px; }
  .wrap{ max-width:560px; margin:0 auto; padding:16px 16px 40px; }
  header{ background:var(--blu); color:#fff; padding:16px; text-align:center; }
  header h1{ margin:0; font-size:20px; font-weight:700; }
  header p{ margin:4px 0 0; font-size:13px; opacity:.9; }
  label{ display:block; font-weight:600; margin:18px 0 6px; }
  .hint{ font-weight:400; color:var(--grigio); font-size:13px; }
  select,input[type=date],input[type=number],textarea{
    width:100%; padding:14px; font-size:17px; border:1px solid var(--bordo);
    border-radius:12px; background:#fff; color:var(--txt); }
  textarea{ min-height:90px; resize:vertical; }
  select{ appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%23667085' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
          background-repeat:no-repeat; background-position:right 14px center; padding-right:44px; }
  .seg{ display:flex; gap:8px; margin-top:2px; }
  .seg button{ flex:1; padding:14px; font-size:17px; border:1px solid var(--bordo);
               border-radius:12px; background:#fff; color:var(--txt); font-weight:600; }
  .seg button.on{ background:var(--blu); color:#fff; border-color:var(--blu); }
  .hidden{ display:none; }
  .btn{ width:100%; margin-top:26px; padding:17px; font-size:19px; font-weight:700;
        color:#fff; background:var(--blu); border:none; border-radius:14px; }
  .btn:disabled{ opacity:.55; }
  .err{ color:#b42318; font-size:14px; margin-top:6px; display:none; }
  .card{ background:#fff; border:1px solid var(--bordo); border-radius:16px; padding:4px 16px 20px; }
  #loading,#done{ text-align:center; padding:40px 16px; }
  #done .tick{ font-size:52px; }
  .linkish{ color:var(--blu); font-weight:700; text-decoration:underline; background:none; border:none; font-size:17px; }
  .small{ font-size:13px; color:var(--grigio); }
</style>
</head>
<body>
<header>
  <h1>Rapportino lavorazione</h1>
  <p>Compila e invia a fine attività</p>
</header>

<div class="wrap">

  <div id="loading" class="card">Caricamento in corso…</div>

  <!-- FORM -->
  <div id="form" class="card hidden">

    <label>Data <span class="hint">(oggi; modificala se il rapportino è di un altro giorno)</span></label>
    <input type="date" id="data">

    <label>Operatore</label>
    <select id="operatore"></select>

    <label>Trattore</label>
    <select id="trattore"></select>

    <label>Cliente</label>
    <select id="cliente"></select>

    <div id="repartoBox">
      <label>Reparto</label>
      <select id="reparto"></select>
    </div>

    <label>Lavorazione</label>
    <select id="lavorazione"></select>

    <!-- Scelta misura per lavorazioni flessibili -->
    <div id="misuraBox" class="hidden">
      <label>Come registrare questa lavorazione?</label>
      <div class="seg" id="misuraSeg"></div>
    </div>

    <!-- Valore numerico -->
    <div id="valoreBox" class="hidden">
      <label id="valoreLabel">Valore</label>
      <input type="number" id="valore" inputmode="decimal" step="any" min="0" placeholder="Es. 3,5">
    </div>

    <label>Note <span class="hint">(facoltative — scrivi o detta con il microfono della tastiera)</span></label>
    <textarea id="note" placeholder="Parametro mancante, lavorazione nuova, commento…"></textarea>

    <button class="btn" id="invia">Invia rapportino</button>
    <p class="err" id="err"></p>
  </div>

  <!-- CONFERMA -->
  <div id="done" class="hidden card">
    <div class="tick">✓</div>
    <p><strong>Rapportino salvato.</strong></p>
    <p class="small">Data, operatore e trattore restano impostati per il prossimo.</p>
    <button class="linkish" id="nuovo">+ Nuovo rapportino</button>
  </div>

</div>

<script>
  // ============================================================
  // INDIRIZZO DEL MOTORE (Apps Script). Deve finire con /exec.
  // Se rifai il deployment da zero e l'URL cambia, aggiornalo qui.
  // ============================================================
  var API_URL = 'https://script.google.com/macros/s/AKfycbxkmBqlWNe5zsY7f6OVSNRFFfy9yKX5v1IVGfBTIjXote9pQgagBcKaOEy40eaeDJ4a/exec';

  var DATI = null;
  var misuraScelta = null;   // misura corrente per lavorazioni flessibili

  // ---- Avvio: carica le anagrafiche dal foglio (senza account: richiesta anonima) ----
  document.addEventListener('DOMContentLoaded', avvia);

  function avvia(){
    if (!API_URL || API_URL.indexOf('/exec') === -1){
      document.getElementById('loading').textContent = 'Configurazione mancante: manca l\'indirizzo del motore (API_URL).';
      return;
    }
    fetch(API_URL + '?action=data')
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(init)
      .catch(function(e){
        document.getElementById('loading').innerHTML =
          'Impossibile caricare gli elenchi (manca la connessione?).<br><br>' +
          '<button class="linkish" onclick="location.reload()">Riprova</button>';
      });
  }

  function oggiISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var g = String(d.getDate()).padStart(2,'0');
    return d.getFullYear()+'-'+m+'-'+g;
  }

  function opt(txt){ var o=document.createElement('option'); o.value=txt; o.textContent=txt; return o; }

  function riempiSelect(id, valori, placeholder){
    var s = document.getElementById(id);
    s.innerHTML = '';
    var ph = opt(placeholder); ph.value=''; ph.disabled=true; ph.selected=true; s.appendChild(ph);
    valori.forEach(function(v){ s.appendChild(opt(v)); });
    s.appendChild(opt(DATI.opzioneAltro));
  }

  function init(dati){
    DATI = dati;
    document.getElementById('data').value = oggiISO();
    riempiSelect('operatore', dati.operatori, '— scegli operatore —');
    riempiSelect('trattore', dati.trattori, '— scegli trattore —');
    riempiSelect('cliente', dati.clienti, '— scegli cliente —');
    riempiSelect('lavorazione', dati.lavorazioni.map(function(l){return l.nome;}), '— scegli lavorazione —');

    document.getElementById('cliente').addEventListener('change', onCliente);
    document.getElementById('lavorazione').addEventListener('change', onLavorazione);
    document.getElementById('invia').addEventListener('click', invia);
    document.getElementById('nuovo').addEventListener('click', nuovo);

    onCliente(); onLavorazione();
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('form').classList.remove('hidden');
  }

  // Cliente → reparti (nascosto se il cliente non ha reparti o è "Altro")
  function onCliente(){
    var cli = document.getElementById('cliente').value;
    var box = document.getElementById('repartoBox');
    var sel = document.getElementById('reparto');
    var reps = (cli && cli !== DATI.opzioneAltro) ? (DATI.reparti[cli] || []) : [];
    if (reps.length === 0){ box.classList.add('hidden'); sel.innerHTML=''; return; }
    box.classList.remove('hidden');
    riempiSelect('reparto', reps, '— scegli reparto —');
  }

  // Lavorazione → misura e campo valore
  function onLavorazione(){
    var nome = document.getElementById('lavorazione').value;
    var misuraBox = document.getElementById('misuraBox');
    var valoreBox = document.getElementById('valoreBox');
    var seg = document.getElementById('misuraSeg');
    misuraScelta = null; seg.innerHTML='';

    var lav = (DATI.lavorazioni||[]).filter(function(l){return l.nome===nome;})[0];

    // "Altro" o lavorazione senza parametro: nessuna misura, si usano le note
    if (!lav || nome === DATI.opzioneAltro || !lav.parametri || lav.parametri.length===0){
      misuraBox.classList.add('hidden'); valoreBox.classList.add('hidden'); return;
    }

    if (lav.parametri.length === 1){
      // misura fissa
      misuraBox.classList.add('hidden');
      misuraScelta = lav.parametri[0];
      mostraValore();
    } else {
      // flessibile: pulsanti di scelta
      misuraBox.classList.remove('hidden');
      valoreBox.classList.add('hidden');
      lav.parametri.forEach(function(par){
        var b = document.createElement('button');
        b.type='button'; b.textContent = par;
        b.addEventListener('click', function(){
          misuraScelta = par;
          Array.prototype.forEach.call(seg.children, function(x){ x.classList.remove('on'); });
          b.classList.add('on');
          mostraValore();
        });
        seg.appendChild(b);
      });
    }
  }

  function mostraValore(){
    var box = document.getElementById('valoreBox');
    var lab = document.getElementById('valoreLabel');
    var etich = { ettari:'Ettari lavorati', ore:'Ore di lavoro', 'quantità':'Quantità', quantita:'Quantità' };
    lab.textContent = etich[misuraScelta] || ('Valore (' + misuraScelta + ')');
    box.classList.remove('hidden');
  }

  function mostraErrore(msg){
    var e = document.getElementById('err');
    e.textContent = msg; e.style.display = msg ? 'block' : 'none';
  }

  function invia(){
    mostraErrore('');
    var data = document.getElementById('data').value;
    var operatore = document.getElementById('operatore').value;
    var trattore = document.getElementById('trattore').value;
    var cliente = document.getElementById('cliente').value;
    var repVisibile = !document.getElementById('repartoBox').classList.contains('hidden');
    var reparto = repVisibile ? document.getElementById('reparto').value : '';
    var lavorazione = document.getElementById('lavorazione').value;
    var note = document.getElementById('note').value.trim();
    var valore = document.getElementById('valore').value;
    var valoreVisibile = !document.getElementById('valoreBox').classList.contains('hidden');
    var altroScelto = [operatore,trattore,cliente,lavorazione].indexOf(DATI.opzioneAltro) !== -1;

    if (!data) return mostraErrore('Indica la data.');
    if (!operatore) return mostraErrore('Scegli l’operatore.');
    if (!trattore) return mostraErrore('Scegli il trattore.');
    if (!cliente) return mostraErrore('Scegli il cliente.');
    if (repVisibile && !reparto) return mostraErrore('Scegli il reparto.');
    if (!lavorazione) return mostraErrore('Scegli la lavorazione.');
    if (document.getElementById('misuraBox').classList.contains('hidden')===false && !misuraScelta)
      return mostraErrore('Scegli se registrare a ore o a ettari.');
    if (valoreVisibile && (valore==='' || Number(valore) <= 0))
      return mostraErrore('Inserisci un valore maggiore di zero.');
    if (altroScelto && !note)
      return mostraErrore('Hai scelto “Altro”: descrivi nelle note cosa indicare.');

    var payload = {
      data:data, operatore:operatore, trattore:trattore, cliente:cliente,
      reparto:reparto, lavorazione:lavorazione,
      misura: valoreVisibile ? misuraScelta : '',
      valore: valoreVisibile ? valore : '',
      note: note
    };

    var btn = document.getElementById('invia');
    btn.disabled = true; btn.textContent = 'Invio…';

    // POST "semplice" (testo): niente login, niente account Google richiesto.
    fetch(API_URL, { method:'POST', body: JSON.stringify(payload) })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(res){
        if (res && res.ok) { mostraConferma(); }
        else { throw new Error((res && res.error) ? res.error : 'risposta non valida'); }
      })
      .catch(function(e){
        btn.disabled = false; btn.textContent = 'Invia rapportino';
        mostraErrore('Invio non riuscito (manca la connessione?). I dati sono ancora qui: riprova tra poco.');
      });
  }

  function mostraConferma(){
    document.getElementById('form').classList.add('hidden');
    document.getElementById('done').classList.remove('hidden');
  }

  // Nuovo rapportino: mantiene data/operatore/trattore, azzera il resto
  function nuovo(){
    document.getElementById('cliente').selectedIndex = 0;
    document.getElementById('lavorazione').selectedIndex = 0;
    document.getElementById('note').value = '';
    document.getElementById('valore').value = '';
    onCliente(); onLavorazione();
    var btn = document.getElementById('invia'); btn.disabled=false; btn.textContent='Invia rapportino';
    mostraErrore('');
    document.getElementById('done').classList.add('hidden');
    document.getElementById('form').classList.remove('hidden');
    window.scrollTo(0,0);
  }
</script>
</body>
</html>
